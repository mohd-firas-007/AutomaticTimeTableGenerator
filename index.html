<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Green Valley International School</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('3.JPG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(5px);  /* Adjust blur amount as needed */
            opacity: 0.8;       /* Adjust opacity as needed (0.0 to 1.0) */
            z-index: -1;
        }

        .welcome-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        .logo {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        .welcome-title {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .welcome-subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .enter-button {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <img src="Logo-copy.png" alt="Green Valley International School" class="logo">
        <h1 class="welcome-title">Welcome to Green Valley International School</h1>
        <p class="welcome-subtitle">Timetable Management System</p>
        <a href="timetable.html" class="enter-button">Enter System</a>
    </div>
    <div class="main-content">
        <!-- Add these lines right here -->
        <div class="corner-lines">
            <div class="corner-line"></div>
            <div class="corner-line"></div>
            <div class="corner-line"></div>
            <div class="corner-line"></div>
        </div>
        <!-- Rest of your existing content -->
    </div>

</body>
</html>
